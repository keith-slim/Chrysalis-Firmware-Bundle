name: Preonic battery and Bluetooth build

on:
  push:
    branches: ['fix/preonic-battery-ble']
  workflow_dispatch:

env:
  LC_ALL: C

jobs:
  build-preonic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install firmware build dependencies
        run: |
          python3 -m pip install --user adafruit-nrfutil
          make setup
      - name: Apply pinned community fixes and compile Preonic only
        run: bash tools/build-preonic-community.sh
      - name: Publish Preonic build artifact
        uses: actions/upload-artifact@v4
        with:
          name: preonic-battery-ble
          path: output/Keyboardio/Preonic/default.zip
          if-no-files-found: error
