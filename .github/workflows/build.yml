name: Preonic PR1540 BLE reconnect test build

on:
  push:
    branches: ['test/preonic-pr1540']
  workflow_dispatch:
  pull_request:
    branches: ['master']

env:
  LC_ALL: C

jobs:
  build-preonic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install firmware build dependencies
        run: |
          python3 -m pip install --user adafruit-nrfutil
          make setup
      - name: Apply pinned community fixes and compile Preonic only
        run: bash tools/build-preonic-community.sh
      - name: Publish Preonic build artifact
        uses: actions/upload-artifact@v4
        with:
          name: preonic-pr1540
          path: output/Keyboardio/Preonic/default.zip
          if-no-files-found: error
